["Q1. CIA Triad","Three pillars of Information Security (plus Authentication & Non-Repudiation).",["🔒|Confidentiality|Only authorised people can see sensitive data.|0","✅|Integrity|Data stays accurate, complete and unaltered in storage or transit.|1","🌐|Availability|Authorised users can reach systems & data whenever needed.|2"],"Bank app: nobody else sees your balance (C); a hacker can’t change ₹50,000 to ₹500 (I); the server is online when you log in (A)."],
["Q2. Cryptosystem & Components","A framework of algorithms, keys and protocols that turns readable data into secret code and back.",["📝|Plaintext|The original human-readable message.|0","⚙️|Encryption Algorithm|Mathematical formula that scrambles plaintext.|1","🔑|Secret Key|Value used by the algorithm to lock/unlock data.|2","🔐|Ciphertext|Scrambled, unreadable output after encryption.|3","🔓|Decryption Algorithm|Reverse formula; ciphertext + key → plaintext.|1"],"WhatsApp: ‘Hello’ (plaintext) → random symbols (ciphertext) using a key → friend’s phone decrypts back to ‘Hello’."],
["Q3. Symmetric vs Asymmetric Cryptography","One shared key vs a public/private key pair.",["🔑|Same key|SYMMETRIC: one key encrypts AND decrypts.|0","⚡|Fast, bulk data|Ideal for large data, but sharing the key safely is risky. DES, 3DES, AES.|0","📬|Public key|ASYMMETRIC: shared openly; anyone can encrypt with it.|1","🗝️|Private key|Kept secret by owner; only it decrypts.|1","🐢|Slower|Solves key-sharing problem. RSA, Diffie-Hellman, ECC.|1"],"Symmetric = house lock, both roommates hold identical keys. Asymmetric = public mailbox: anyone drops a letter (public key), only the postman’s master key (private) opens it."],
["Q4. DES, 2DES & 3DES","DES: symmetric block cipher, 64-bit blocks, 56-bit effective key, 16 Feistel rounds.",["📦|64-bit block|Plaintext split into 64-bit blocks.|0","🔀|Initial Permutation|Bits are rearranged first.|0","🔁|16 Feistel Rounds|Expansion → XOR round key → S-Box substitution → P-Box permutation.|0","🏁|Final Permutation|Inverse of the initial one → ciphertext.|0","⚠️|Why weak|56-bit key = 2⁵⁶ combos; brute-forced in hours today.|2","2️⃣|2DES|DES twice (K1,K2) – broken by Meet-in-the-Middle attack.|2","3️⃣|3DES|Encrypt K1 → Decrypt K2 → Encrypt K3. 112/168-bit; practically unbreakable.|1"],"DES = diary with a 4-digit padlock. 3DES = diary inside three boxes with different combinations."],
["Q5. RSA Algorithm","Public-key algorithm whose security rests on the difficulty of factoring a product of two huge primes.",["🔢|Pick primes|p = 3, q = 11|0","✖️|Compute n & φ|n = p×q = 33; φ(n) = (p−1)(q−1) = 20|0","🔑|Choose e, find d|e = 3 (coprime to 20) → Public (3,33). d = 7 since 7×3 = 21 ≡ 1 mod 20 → Private (7,33).|1","🔒|Encrypt|C = Mᵉ mod n. M=4 → 4³ mod 33 = 64 mod 33 = 31|2","🔓|Decrypt|M = Cᵈ mod n = 31⁷ mod 33 = 4|3"],"HTTPS banking: your browser encrypts the session key with the bank’s RSA public key; only the bank’s private key unlocks it."],
["Q6. Diffie-Hellman & MitM","Two strangers create a shared secret over a public network without ever sending the key.",["📢|Public agreement|Alice & Bob agree on prime p and base g.|0","🤫|Secrets|Alice picks a, Bob picks b (never sent).|1","📤|Exchange|Alice → A = gᵃ mod p; Bob → B = gᵇ mod p.|2","🗝️|Same key!|Alice: Bᵃ mod p; Bob: Aᵇ mod p → both = g^(ab) mod p.|3","🕵️|MitM attack|DH doesn’t authenticate A/B. Mallory swaps in her own values, holds two keys and reads/alters everything.|2"],"Paint mixing: start yellow; Alice adds secret red, Bob adds blue; swap mixtures and add own secret → both get the same brown."],
["Q7. Hash Functions: MD5 vs SHA-1","Fixed-length digital fingerprint (message digest) of any-size data.",["📄|Any-size input|File, message or password.|0","🌪️|Hash function|Crushes data into a fixed-length digest.|0","🔒|Pre-image resistance|One-way: can’t reverse hash to input.|1","💥|Avalanche effect|Change one letter → whole hash changes.|1","🚫|Collision resistance|Practically impossible to find 2 inputs, same hash.|1","⚖️|MD5 vs SHA-1|MD5: 128-bit (32 hex), fast but broken. SHA-1: 160-bit (40 hex), stronger; SHA-256 used now.|2"],"Software download page shows a checksum. You hash the file; if codes match, it wasn’t corrupted or tampered with."],
["Q8. Digital Signature","Hash of a document encrypted with the sender’s private key.",["📄|Document|Sender has a document to sign.|0","#️⃣|Hash it|Message digest of the document.|0","✍️|Sign|Encrypt the hash with sender’s PRIVATE key = signature.|1","📨|Send|Document + signature travel to receiver.|1","🔍|Verify|Receiver decrypts with sender’s PUBLIC key & compares hashes.|2","🏅|Services|Authentication · Integrity · Non-repudiation. One comma changed = signature invalid (unlike a scanned image).|3"],"Verified-signature tick on an e-degree or income certificate: marks can’t be altered without breaking the seal."],
["Q9. Kerberos & Realm","Ticket-based network authentication so passwords aren’t sent repeatedly.",["👤|User login|Logs in once; request goes to AS.|0","🎫|AS → TGT|Authentication Server verifies and issues a Ticket Granting Ticket.|1","🏢|TGS|Checks TGT, issues a Service Ticket for the requested server.|2","🎟️|Service Ticket|User presents it to the service.|2","🖥️|Service Server|Validates ticket, grants access.|3","🌍|Realm|Administrative domain of one Kerberos DB; cross-realm trust lets Realm A (Engg) users reach Realm B (HR).|0"],"Amusement park wristband: show ID once at entrance (AS), flash wristband at every ride (TGS/service)."],
["Q10. PGP Email Security","Combines symmetric + asymmetric crypto for Confidentiality, Authentication, Integrity & Compression.",["✍️|1. Authentication|Hash email, encrypt hash with sender’s private key (signature).|0","🗜️|2. Compression|Message + signature ZIP-compressed.|1","🔑|3a. Session key|Random one-time symmetric key encrypts the compressed data.|2","📬|3b. Wrap key|Session key encrypted with receiver’s PUBLIC key.|3","📧|Send|Receiver reverses every step with own private key.|0"],"Signed contract in a locked briefcase (symmetric); the briefcase key sits in a small box only the recipient’s key opens."],
["Q11. Firewall, Types & DMZ","Hardware/software barrier filtering traffic by predefined rules.",["🌍|Internet|Untrusted traffic arrives.|2","🧱|Packet Filter|Checks IP & ports – fast, basic.|0","🔄|Stateful Inspection|Tracks connection state; only valid replies pass.|1","🕵️|Application Gateway|Proxy that inspects HTTP/FTP content deeply.|3","🏬|DMZ|Buffer subnet holding Web/Email/DNS servers so a hacked website can’t reach internal DB.|2","🏦|Internal LAN|Protected core network.|1","⛔|Limitations|Can’t stop insiders, encrypted-malware, USB drives or social engineering.|2"],"Firewall = lobby security guard checking badges; DMZ = reception lounge – higher clearance needed for the server rooms upstairs."],
["Q12. GSM & CDMA Security (AAA)","Authentication, Authorization, Accounting + over-the-air encryption.",["📱|SIM holds Ki|Secret key never transmitted.|0","❓|RAND challenge|Network sends a random number.|0","🧮|A3 → SRES|SIM computes signed response; network compares → authenticated.|1","🔑|A8 → Kc|Session key from Ki + RAND.|2","📡|A5 encryption|Scrambles voice/data phone ↔ tower.|2","🌈|CDMA|Spread-spectrum with unique PN codes; CAVE authentication + ORYX encryption.|3"],"Switch on a phone: network sets a secret math puzzle (A3); only the genuine SIM solves it."],
["Q13. Password Authentication","Compare entered password’s hash with the stored hash.",["⌨️|Enter password|User types it.|0","🧂|Salt + hash|Random salt added, then hashed – never store plaintext.|1","⚖️|Compare|Match with stored salted hash.|1","💣|Vulnerabilities|Brute force, dictionary, phishing, credential stuffing, shoulder surfing.|2","🛡️|Best practice|12–16+ chars mixed, no reuse, MFA/2FA.|3"],"‘rahul123’ cracks in under a second; ‘BlueTiger#Eats99Mangoes!’ takes centuries."],
["Q14. Card & UPI Payment Security","Threats: skimming, phishing links, fake QR, SIM swap, public Wi-Fi sniffing.",["💳|Tap / UPI pay|Transaction starts.|0","🎭|Tokenization & EMV|Dynamic token replaces real 16-digit number.|1","🔢|2FA|OTP / UPI PIN for each outgoing payment.|1","🔔|Limits & alerts|Daily caps, disable international use, instant SMS/email.|2","🙈|Safe habits|PIN only to SEND (never to receive), cover keypad, avoid public Wi-Fi.|3"],"Even if a merchant database is hacked, thieves can’t reuse your card – they only get a temporary alias."],

["Q17. Active vs Passive Attacks","Listening vs altering.",["👂|Passive|Secretly monitors traffic, changes nothing – violates Confidentiality; hard to detect (use encryption).|0","📡|Examples|Eavesdropping/wiretapping, traffic analysis.|0","✋|Active|Modifies, deletes, replays, blocks or impersonates – violates Integrity & Availability.|2","💥|Examples|Man-in-the-Middle, DoS, session replay, SQL injection.|2","🔎|Detect & defend|Easier to detect: firewalls, digital signatures, IDS.|2"],"Passive = reading your postcard unchanged. Active = changing a cheque from ₹1,000 to ₹1,00,000 or tearing it up."],

["Q21. Hacker vs Cracker","Ethical white hat vs malicious black hat.",["🎩|Hacker (White Hat)|Skilled expert who legally tests systems with permission and fixes loopholes.|1","🔓|Locksmith analogy|Hired by the bank to test the vault.|1","🥷|Cracker / Attacker (Black Hat)|Breaks in illegally: steals data, bypasses licenses, spreads malware.|2","🏴‍☠️|Robber analogy|Breaks into the vault at night.|2"],"A hacker is a locksmith hired by the bank; a cracker is the robber."],

["Q23. IT Act, 2000 (India)","India’s primary cyber law (amended 2008) for e-commerce, digital signatures & cybercrime.",["📜|Sec 4 & 5|Electronic records & digital signatures = legally valid like paper/handwritten.|0","🕳️|Sec 43 & 66|Unauthorised access, data theft, viruses – up to 3 yrs and/or ₹5 lakh.|1","🪪|Sec 66C & 66D|Identity theft; cheating by personation online.|2","💣|Sec 66F|Cyber terrorism – life imprisonment.|3","🔞|Sec 67|Publishing/transmitting obscene material.|2","🚨|Sec 70B – CERT-In|National nodal agency for incident response.|0"],"Fake profile with your stolen photos → booked under 66C (identity theft) and 66D (cheating by personation)."],

const T=[
"Information security protects data and systems from unauthorised access, change and disruption. Every control maps to one of three goals: Confidentiality (encryption, access control), Integrity (hashing, digital signatures, checksums) and Availability (backups, redundancy, DoS protection). Authentication (proving identity) and Non-Repudiation (cannot deny an action) support the triad. In exams, always explain each pillar with the threat that breaks it and a control that defends it.",
"A cryptosystem is the full set of plaintext space, ciphertext space, key space, and the encryption and decryption algorithms. Security should depend only on the secrecy of the key, never on hiding the algorithm (Kerckhoffs’s principle). The same plaintext gives different ciphertext under different keys, so a long, random key is what protects the data.",
"Symmetric ciphers (DES, AES) are fast and suit bulk data, but n users need n(n−1)/2 shared keys and the key must travel securely. Asymmetric ciphers use a mathematically linked pair: encrypt with the public key for confidentiality, or sign with the private key for authentication. In practice both are combined (hybrid encryption): asymmetric crypto exchanges a symmetric session key, which then encrypts the data. This is how HTTPS and PGP work.",
"DES splits a 64-bit block into two 32-bit halves and runs 16 Feistel rounds; each round uses a 48-bit subkey derived from the 56-bit key, with S-boxes giving confusion and P-boxes giving diffusion. Decryption is the same process with subkeys in reverse order. 2DES looks like 112-bit security but a Meet-in-the-Middle attack (encrypt from one end, decrypt from the other and match) cuts it to about 2⁵⁷ effort. 3DES in EDE mode avoids this and was widely used before AES replaced it.",
"RSA security rests on the fact that multiplying two large primes is easy, but factoring the product n is infeasible. Real keys are 2048+ bits. Anyone can encrypt with (e, n); only the holder of d can decrypt, because d is the modular inverse of e mod φ(n). The same maths run backwards gives digital signatures. Remember the worked example: p=3, q=11, n=33, φ=20, e=3, d=7, M=4 → C=31 → M=4.",
"Diffie-Hellman relies on the discrete logarithm problem: given gᵃ mod p, finding a is hard. Both sides compute g^(ab) mod p without ever transmitting a or b. It provides key agreement only, not authentication, so an active attacker can run two separate exchanges (MitM). The fix is to authenticate the exchanged values with digital signatures or certificates, as TLS does.",
"A hash function is deterministic and fast, and outputs a fixed size. Pre-image resistance, second pre-image resistance and collision resistance are its security properties; the avalanche effect means about half the output bits flip when one input bit changes. MD5 (128-bit) and SHA-1 (160-bit) both have practical collision attacks, so SHA-256/SHA-3 are used now. Hashes give integrity checking, password storage and are a building block of digital signatures.",
"The signer hashes the document (so large files stay fast) and encrypts the digest with the private key. Anyone can decrypt with the public key and compare it with a fresh hash of the received document. A match proves authentication, integrity and non-repudiation. A scanned image proves none of these because it is not mathematically tied to the content.",
"Kerberos (MIT, Needham-Schroeder based) uses a trusted third party, the KDC, made of the AS and TGS. The password never crosses the network: tickets are encrypted with keys derived from it, and timestamps/authenticators prevent replay. Single sign-on is achieved because the TGT is reused for many services until it expires. Each realm has its own KDC database; inter-realm trust lets a TGS in one realm issue tickets valid in another.",
"PGP gives four services: authentication (signature), confidentiality (session-key encryption), compression (ZIP, applied after signing and before encryption) and email compatibility (Radix-64). It uses a web of trust instead of central CAs: users sign each other’s public keys and store them on a key ring. Receiver steps: decrypt the session key with own private key, decrypt the message, decompress, then verify the signature.",
"A firewall enforces policy at the network boundary. Packet filters work at the network/transport layer (stateless, fast, easily fooled); stateful inspection remembers connections; application gateways work at layer 7 and hide internal hosts. Common configurations are screened host, dual-homed host and screened subnet (DMZ), where two firewalls separate internet, DMZ and LAN. A firewall is only one layer of defence, so it is paired with IDS/IPS, antivirus and user training.",
"GSM authentication is one-way: the network authenticates the SIM, not vice versa (so fake base stations are possible). Ki stays in the SIM and the operator’s AuC; only RAND, SRES and Kc travel. A5/1 and A5/2 are stream ciphers on the radio link. CDMA gives inherent privacy through spreading codes, and CAVE/ORYX handle authentication and encryption. Newer 3G/4G standards add mutual authentication.",
"Systems should store only salted, slow hashes (bcrypt, scrypt, Argon2) so that identical passwords give different hashes and rainbow tables are useless. Length matters more than complexity: each extra character multiplies the brute-force effort. Credential stuffing works because people reuse passwords, so unique passwords plus a password manager and MFA (something you know + have + are) are the real defence.",
"Card-not-present and UPI fraud mostly exploits people, not cryptography. Tokenization (RBI-mandated for card-on-file) means merchants store a token, not the PAN. EMV chips generate a one-time cryptogram per transaction, defeating cloned magnetic stripes. For UPI, remember: PIN is entered only to send money; a ‘collect request’ or QR scan that asks for PIN to receive is a scam. Report fraud quickly on 1930.",
"The OWASP Top 10 lists the main web risks. SQLi injects commands into queries (fix: prepared statements). XSS runs attacker scripts in the victim’s browser (fix: output encoding, Content-Security-Policy). CSRF forces a logged-in user to send unwanted requests (fix: anti-CSRF tokens, SameSite cookies). Defence in depth means validating input, using HTTPS, a WAF, least privilege and regular patching.",
"A digital certificate (X.509) binds an identity to a public key and is signed by a CA. The chain of trust runs from a root CA (pre-installed in browsers) through intermediates to the site. Registration Authorities verify identity, and revoked certificates are published through CRL or OCSP. PKI therefore supplies the trust that Diffie-Hellman and public-key encryption lack. Digital infrastructure security extends this to resilient networks, data centres and identity systems.",
"Passive attacks threaten confidentiality and leave no trace, so the defence is prevention (encryption). Active attacks (masquerade, replay, modification, DoS) threaten integrity and availability and can be detected, so the defence is detection plus recovery. This classification is from the OSI security architecture (X.800) and is a common 5-mark answer.",
"Malware is classified by how it spreads and what triggers it. A virus needs a host file and user action; a worm is self-propagating and exploits network vulnerabilities (WannaCry used the EternalBlue SMB flaw); a trojan relies on deception and does not self-replicate; a logic bomb is a conditional payload, often an insider threat. These can combine in one attack, and ransomware is usually delivered by a trojan or worm.",
"Virus phases: dormant (idle), propagation (infects other programs), triggering (condition met) and execution (payload runs). Antivirus uses signatures (fast but misses new malware), heuristics/behaviour analysis (catches variants but can give false positives), sandboxing (detonate in isolation) and patching to remove the vulnerabilities viruses exploit. Four generations: simple scanners, heuristic scanners, activity traps, full-featured protection.",
"Social engineering exploits trust, urgency, fear and authority. Phishing is mass; spear phishing targets one person using researched details; vishing uses calls and smishing uses SMS. Pretexting builds a believable story; baiting tempts with a ‘free’ item; tailgating exploits politeness at doors. Technology helps (spam filters, MFA), but verification habits and awareness training are the strongest defence.",
"‘Hacker’ originally meant a clever programmer. Today, White Hats work under written permission (penetration testers, bug-bounty researchers), Black Hats act illegally for gain or harm, and Grey Hats act without permission but often without malicious intent. Legality depends on authorisation, not on skill, and in India unauthorised access is punishable under IT Act Sec 43/66.",
"Modern threats are industrialised: ransomware gangs rent tools as a service and use double extortion (encrypt and leak). Generative AI makes phishing flawless and enables voice/video deepfakes. Poorly secured IoT devices (default passwords) form botnets like Mirai. Supply-chain attacks (SolarWinds) abuse trusted update channels. Defence: zero-trust, offline backups, patching, MFA and vendor risk checks.",
"The IT Act 2000 was based on the UNCITRAL Model Law and gives legal recognition to e-records and e-signatures, makes the Controller of Certifying Authorities responsible for licensing CAs, and defines cyber offences and penalties. The 2008 amendment added Sec 66A–66F, intermediary liability (Sec 79) and CERT-In’s statutory role (70B). Sec 66A was struck down by the Supreme Court in 2015 (Shreya Singhal), which is a useful exam point.",
"India uses a layered institutional model: CERT-In responds to incidents, I4C coordinates enforcement and victim reporting, NCIIPC protects critical infrastructure (under Sec 70A), and Cyber Swachhta Kendra helps citizens clean infected devices. Regular exercises build readiness: participants practise detection, coordination and recovery under realistic attack scenarios. Awareness programmes such as Cyber Jaagrookta Diwas complete the picture.",
"Digital content is easy to copy perfectly, so protection uses both technology and law. DRM and encryption control access and use; watermarks and rights-management information help trace leaks. Copyright Act Sec 65A/65B make circumventing them illegal, while IT Act Sec 79 and the Intermediary Rules require platforms to act on takedown notices. Fair dealing (education, review, news) remains a permitted exception.",
"IPR protects intangible creations. Patent: invention, needs novelty, registration, 20 years from filing. Copyright: expression not idea, arises automatically on creation, life + 60 years. Trademark: source identifier, registered for 10 years and renewable indefinitely. Trade secret: no registration, protected by confidentiality and NDAs, lost once public. They can overlap: one product may use all four.",
"India’s patent system works on a first-to-file basis through the Indian Patent Office (Kolkata, Delhi, Mumbai, Chennai). A provisional specification secures an early filing date with 12 months to file the complete specification. Publication occurs at 18 months (early publication can be requested), and examination happens only after an RFE. After the FER reply, a pre-grant opposition may be filed by anyone and a post-grant opposition within 12 months of grant. Annual renewal fees keep the patent alive for 20 years.",
"The Act patents products and processes that are novel, involve an inventive step and are industrially applicable. Sec 3 lists exclusions: mere discovery, mathematical methods, business methods, computer programs per se, methods of treatment, and new forms of known substances without improved efficacy (3(d)). Compulsory licences under Sec 84 can be sought after three years if the invention is not available at a reasonable price or in adequate quantity (the first was Natco’s Nexavar licence in 2012).",
"A ‘design’ is only the visual features (shape, configuration, pattern, ornament, composition of lines or colours) of a finished article, judged by the eye. It must be new and original, not previously published anywhere, and not obscene or purely functional. Registration gives a copyright-like monopoly over the look for 10 years, extendable by 5. Where the same product has a technical invention, a patent can be filed in parallel.",
"The author is the first owner, but exceptions include work for hire under a contract of service and government works. Infringement can be civil (injunction, damages, accounts), criminal (imprisonment and fine under Sec 63) or administrative (border seizure). Rights may be assigned (full ownership, in writing, specifying rights, territory and duration) or licensed (exclusive, non-exclusive, compulsory). If an assignment does not state a duration, it is deemed to be 5 years."];

// UNIT 1
A("Basic Security Components (Security Services)","The services every secure system must provide (ITU-T X.800).",["🪪|Authentication|Proves who you are.|0","🚪|Access Control|Decides what you may do.|1","🔒|Confidentiality|Hides data from outsiders.|2","✅|Integrity|Detects tampering.|3","✍️|Non-repudiation|Cannot deny an action.|0"],"Office: ID card (authentication), floor key (access control), sealed envelope (confidentiality).","X.800 groups security services as authentication, access control, data confidentiality, data integrity and non-repudiation; mechanisms such as encryption, signatures and firewalls implement them.");
A("Information Security Threats","Four basic attack types on an information flow.",["✂️|Interruption|Resource destroyed/unavailable (attacks availability).|2","👂|Interception|Unauthorised party reads data (confidentiality).|0","✏️|Modification|Data altered in transit (integrity).|1","🎭|Fabrication|Fake data/messages inserted (authenticity).|3"],"Cutting a phone line = interruption; wiretap = interception; edited cheque = modification; forged email = fabrication.","Threats are classified by how they disturb the normal source-to-destination flow. Interception is passive; the other three are active attacks.");
A("Cryptographic Principles","Core ideas behind every cipher.",["🔀|Substitution|Replace letters/bits with others.|0","🔃|Transposition|Rearrange positions.|1","🌫️|Confusion|Hide key–ciphertext relation.|2","💨|Diffusion|Spread plaintext change across ciphertext.|3","🗝️|Kerckhoffs|Only the key is secret.|0"],"Shuffling a deck (transposition) and swapping card faces (substitution) – good ciphers do both many times.","Shannon proposed confusion and diffusion. Modern block ciphers repeat substitution–permutation rounds; security must rest on the key, not on a secret algorithm.");
A("Types of Cryptography","Classified by number of keys and by how data is processed.",["🔑|Secret key|One shared key (DES, AES).|0","📬|Public key|Key pair (RSA, ECC).|1","#️⃣|Hash functions|No key; digest (SHA).|2","🧱|Block cipher|Fixed-size chunks.|3","🌊|Stream cipher|Bit-by-bit keystream (RC4).|3"],"Locker with one key (secret) vs mailbox (public) vs fingerprint (hash).","Three families: secret-key, public-key and hash. Orthogonally, ciphers are block or stream. Real systems combine all of them.");
A("Classical Ciphers: Caesar & Transposition","Pre-computer ciphers – easy to break but ideal for learning.",["🔤|Caesar|Shift each letter by k: C=(P+k) mod 26.|0","🔡|Monoalphabetic|Any letter mapping – frequency analysis breaks it.|1","🔁|Vigenère|Repeating keyword – polyalphabetic.|2","📐|Rail fence|Transposition: zig-zag write, row read.|3"],"HELLO with shift 3 becomes KHOOR.","Caesar has only 25 useful keys, so brute force is trivial. Substitution ciphers keep letter frequencies; transposition keeps letters but changes order.");
A("Breaking DES","Why DES is retired and how it was attacked.",["🔨|Brute force|2⁵⁶ keys; EFF Deep Crack broke it in days (1998).|2","📈|Differential|Study how input differences change output.|0","📉|Linear|Linear approximations of S-boxes.|1","⚡|Today|GPUs/FPGAs crack in hours → replaced by AES.|3"],"A 56-bit lock is like a 7-digit-equivalent padlock: a machine tries every option.","DES is resistant to differential cryptanalysis by design, but its short key is fatal. Meet-in-the-Middle defeats 2DES; AES (128/192/256) is the standard now.");
A("Needham-Schroeder Protocol","Key-distribution protocol using a trusted server (basis of Kerberos).",["👩|A → S|A tells server she wants to talk to B, sends nonce N1.|0","🏛️|S → A|Server replies with session key Kab and a ticket for B, both encrypted.|1","🎫|A → B|A forwards the ticket; B learns Kab.|2","🔁|Handshake|B sends nonce, A replies N−1: proves freshness.|3"],"Like a hotel desk giving you a sealed note for the manager so both share a code.","Nonces prevent replay, but the original protocol is vulnerable to replay of an old ticket (Denning–Sacco), fixed in Kerberos with timestamps.");
A("Key Management & Distribution","Generating, storing, distributing, rotating and destroying keys.",["🎲|Generate|Use a strong random source.|0","📦|Distribute|KDC, key agreement (DH) or PKI.|1","🏦|Store|HSM, encrypted key store.|2","♻️|Rotate|Change keys regularly or after compromise.|3","🗑️|Destroy|Securely erase expired keys.|0"],"A bank changes safe combinations when an employee leaves.","Most real breaches come from poor key handling, not broken algorithms. Key hierarchies use master keys to protect session keys.");
A("Digital Certificates & Revocation","X.509 certificate binds identity to a public key; CAs can revoke it.",["🪪|X.509 fields|Subject, public key, issuer, validity, serial, signature.|0","🏛️|CA chain|Root → intermediate → site.|1","🚫|CRL|List of revoked serials, downloaded periodically.|2","⚡|OCSP|Live status query for one certificate.|3"],"Like checking a driving licence and also calling the RTO to see if it was cancelled.","Certificates expire, and are revoked when private keys leak. OCSP stapling lets servers deliver fresh status to browsers.");
A("PGP Key Rings & Web of Trust","PGP trust is decentralised instead of CA-based.",["🔑|Private key ring|Your secret keys, protected by a passphrase.|0","📚|Public key ring|Others’ public keys.|1","🤝|Signing keys|Users sign keys they have verified.|2","🕸️|Web of trust|Trust is computed from signatures of trusted friends.|3"],"You trust a stranger because two friends you trust vouch for them.","Key IDs and fingerprints help verify keys. Compared to PKI, there is no central authority, but trust management is harder.");
// UNIT 2
A("Multi-Factor Authentication (MFA)","Combine different kinds of evidence.",["🧠|Know|Password, PIN.|0","📱|Have|OTP, token, SIM, smart card.|1","🖐️|Are|Fingerprint, face.|2","🔐|Combine|Two or more factors → much harder to attack.|3"],"ATM: card (have) + PIN (know).","MFA defeats stolen-password attacks, but SIM swap and OTP phishing remain risks; app-based or hardware tokens are stronger.");
A("Realm in Kerberos: Cross-Realm Authentication","How a user from Realm A reaches a server in Realm B.",["👤|Client in Realm A|Gets TGT from A’s AS.|0","🏢|Local TGS|Client asks for a cross-realm TGT for realm B.|1","🤝|Trust link|Realms share an inter-realm key.|2","🏬|Remote TGS (B)|Issues service ticket in B.|3","🖥️|Service in B|Grants access.|1"],"Passport (A) + visa stamp (trust) lets you enter country B.","Realm names are by convention upper-case domains, e.g. ENGG.EDU. Principals are written user@REALM.");
A("SHA-1 Algorithm","160-bit hash with 512-bit blocks.",["📏|Padding|Add 1, zeros, then 64-bit length → multiple of 512.|0","🧮|Init|Five 32-bit registers A–E.|1","🔁|80 steps|4 rounds × 20 using logic functions and constants.|2","📤|Output|160-bit digest.|3"],"A meat grinder: every input becomes a fixed-size mince.","SHA-1 is deprecated after the 2017 SHAttered collision; use SHA-256/SHA-3.");
A("MD5 Algorithm","128-bit hash with 512-bit blocks.",["📏|Padding|Pad message to 448 mod 512 then append 64-bit length.|0","🧮|Init|Four 32-bit buffers A,B,C,D.|1","🔁|64 steps|4 rounds × 16 operations.|2","📤|Digest|128 bits = 32 hex chars.|3"],"Checksum listed beside a download file.","MD5 is fast but collisions can be generated in seconds, so it is unsafe for signatures or passwords; still used for non-security checksums.");
A("HMAC & Applications of Hashing","Keyed hash for message authentication.",["🔑|Shared key|Sender and receiver know K.|0","#️⃣|HMAC|H((K⊕opad) ‖ H((K⊕ipad) ‖ M)).|1","📨|Send M + tag|Receiver recomputes tag.|2","🧰|Uses|Integrity, password storage, digital signatures, blockchain.|3"],"A tamper-proof seal that only holders of the secret stamp can make.","Plain hashes can be recomputed by attackers; HMAC adds a key so only authorised parties can create a valid tag.");
A("Malicious Software: Types","Malware family beyond virus/worm.",["🔐|Ransomware|Encrypts files for ransom.|0","🕵️|Spyware/Keylogger|Secretly records activity.|1","📢|Adware|Unwanted ads.|2","🫥|Rootkit|Hides at OS level.|3","🤖|Botnet|Remote-controlled infected machines.|0"],"A keylogger on a cyber-café PC steals your login.","Malicious code is classified by propagation (virus, worm) and payload (spyware, ransomware, backdoor).");
A("Virus Types & Countermeasures","How viruses hide and how they are caught.",["💽|Boot sector|Infects startup code.|0","📑|Macro|Lives in Office documents.|1","🧬|Polymorphic|Changes its code each copy.|2","🌀|Metamorphic|Rewrites itself fully.|3","🛡️|Countermeasures|Signature + heuristic scan, sandbox, patches, backups.|1"],"Like a flu strain mutating each season so the old vaccine fails.","Polymorphic and metamorphic viruses defeat simple signature matching, so behaviour-based detection is required.");
A("Online & Mobile Banking Security","Safe habits and bank controls.",["🔐|Encrypted channel|HTTPS/TLS, app pinning.|0","🔢|MFA & OTP|Login and transaction OTP.|1","📲|Device binding|App tied to SIM/device.|2","🚨|Alerts|Instant SMS, session timeout.|3"],"Bank never asks for OTP or PIN on a call.","Threats: phishing, malware overlays, SIM swap and fake apps. Install apps only from official stores and keep the OS updated.");
A("Debit & Credit Card Security","Layers that protect card payments.",["💳|EMV chip|Unique cryptogram per transaction.|0","🔢|CVV & PIN|Card-not-present and ATM checks.|1","🛡️|3-D Secure OTP|Extra online verification.|2","🎫|Tokenization|Merchant stores token not card number.|3"],"Chip cards are far harder to clone than magnetic-stripe cards.","Skimming, shimming and card-not-present fraud are the main threats. Set limits and enable alerts.");
A("UPI Security Flow","How a UPI payment is protected.",["📱|App + device binding|SIM-bound registration.|0","🆔|VPA|Virtual address hides bank details.|1","🔢|UPI PIN|Entered only to send money.|2","🏦|NPCI switch|Routes request to banks.|3","✅|Confirmation|Instant debit/credit alerts.|1"],"Scanning a fake QR and entering PIN to ‘receive’ money = scam.","UPI uses two-factor authentication (device + PIN). Frauds are mostly social engineering: collect requests, fake QR, remote-access apps.");
// UNIT 3
A("How Cyber Criminals Work","Typical stages of an attack (cyber kill chain).",["🔭|Recon|Gather info about victim.|0","🧨|Weaponize & deliver|Phishing mail, USB, exploit.|1","🚪|Exploit & install|Gain foothold, backdoor.|2","🕹️|Command & control|Remote control.|3","💰|Action|Steal, encrypt, destroy.|0"],"Burglar studies house, picks lock, enters, takes valuables.","Breaking any stage of the chain stops the attack, which is why layered defence is used.");
A("Preventing Cyber Crime Victimization","Practical rules for users.",["🔄|Update|Patch OS and apps.|0","🔑|Strong passwords + MFA|Unique per site.|1","🔗|Think before click|Verify links and senders.|2","💾|Backup|Offline copies.|3","📞|Report|Call 1930 / cybercrime.gov.in.|0"],"Report within the ‘golden hour’ to freeze fraudulent transfers.","Most attacks succeed through user mistakes; hygiene plus quick reporting greatly reduces loss.");
A("Cyber Security Incident Handling","Structured response to a security incident.",["🧰|Preparation|Policy, team, tools.|0","🔎|Detection & analysis|Logs, IDS alerts.|1","🧯|Containment|Isolate affected systems.|2","🧹|Eradication & recovery|Remove malware, restore.|3","📝|Lessons learned|Report and improve.|0"],"Fire brigade: detect, isolate, extinguish, rebuild, investigate cause.","CERT-In directs organisations to report incidents within 6 hours. Evidence must be preserved for forensics.");
A("Cyber Security Threat Landscape","Who attacks and what they want.",["🥷|Cybercriminals|Money: ransomware, fraud.|0","🏛️|Nation-states|Espionage, sabotage.|1","✊|Hacktivists|Political message.|2","👷|Insiders|Misuse access.|3"],"Hospital ransomware vs state-sponsored grid attack.","The landscape keeps shifting with technology (cloud, IoT, AI), so organisations run continuous risk assessment.");
A("Cyber Security Techniques","Defence-in-depth toolbox.",["🔐|Encryption|Protect data at rest/in transit.|0","🚧|Firewall/IDS/IPS|Filter and detect.|1","🩹|Patching|Remove vulnerabilities.|2","🔑|Access control|Least privilege.|3","💾|Backup & logging|Recover and audit.|0"],"Castle: moat, wall, guards and a vault.","No single tool is enough; layers mean one failure does not expose everything.");
A("Firewall Configurations","Common placements of firewalls.",["🖥️|Screened host|Packet filter + bastion host.|0","🧱|Dual-homed|Host with two NICs, no routing.|1","🏬|Screened subnet (DMZ)|Two firewalls, DMZ between.|2","🏦|Internal|Protected LAN.|3"],"Reception area with two security checkpoints.","The screened subnet is the most secure and most common design because a compromised DMZ server still cannot reach the LAN.");
A("IT Act: Offences & Penalties","Major cyber offences under the IT Act 2000/2008.",["🕳️|Sec 43|Civil: damage to computer, compensation.|0","💻|Sec 66|Criminal hacking, up to 3 yrs.|1","🪪|Sec 66C/D|Identity theft, personation.|2","🔞|Sec 67/67A/67B|Obscene content; child content stricter.|3","⚖️|Adjudication|Adjudicating officer, then TDSAT appeal.|0"],"Fake bank site stealing OTPs → Sec 66D.","Sec 66A (offensive messages) was struck down in Shreya Singhal v. Union of India (2015).");
((t)=>{})("Hackers & Attackers: Types","Motivations decide the hat colour.",["🎩|White hat|Authorised testing.|1","🎩|Black hat|Illegal gain.|2","🎩|Grey hat|No permission, no malice.|3","👶|Script kiddie|Uses ready tools.|0"],"Bug-bounty researcher vs ransomware gang.","Legality depends on authorisation. Penetration testers always work under a signed scope.");
A("Web Application Security: SQLi & XSS","The two classic injection attacks.",["💉|SQL injection|Input becomes part of the query.|2","🛡️|Fix|Prepared statements, validation.|1","📜|XSS|Attacker script runs in victim’s browser.|2","🧼|Fix|Output encoding, CSP, HttpOnly cookies.|1"],"A comment box on a forum that runs the script of the commenter.","Reflected, stored and DOM XSS differ in where the payload lives. Stored XSS is the most dangerous.");
A("Digital Infrastructure Security","Protecting critical backbone systems.",["🌐|Networks|Redundant links, segmentation.|0","☁️|Data centres/cloud|Hardening, access control.|1","🪪|Identity systems|IAM, MFA.|2","🔄|Resilience|Backups, DR drills.|3"],"Power grid and UPI rely on this backbone.","Critical Information Infrastructure is designated under IT Act Sec 70 and protected by NCIIPC.");
A("Cyber Security Initiatives in India","National programmes.",["📘|NCSP 2013|National Cyber Security Policy.|0","🚨|CERT-In|Incident response.|1","🛰️|NCCC|Threat monitoring centre.|2","🇮🇳|Cyber Surakshit Bharat|Awareness for CISOs.|3","🚓|I4C|Crime coordination.|0"],"Citizens can report fraud at cybercrime.gov.in or dial 1930.","These bodies work with sector regulators such as RBI and SEBI, which issue their own cyber rules.");
// UNIT 4
A("Nature of Intellectual Property","Creations of the mind with legal protection.",["💡|Intangible|No physical form.|0","⏳|Limited term|Then public domain.|1","🌍|Territorial|Rights per country.|2","💰|Economic asset|Can be sold or licensed.|3"],"A song can be played by many while the owner keeps the right.","IPR encourages innovation by giving creators a temporary monopoly in exchange for public disclosure.");
A("The IPR Toolkit","Steps to manage IP.",["🔍|Identify|What is protectable?|0","🔎|Search|Check prior art.|1","📝|Register|File with IP office.|2","🛡️|Protect & enforce|Monitor, license, sue.|3"],"Startup logs inventions, files patents, trademarks the brand.","A good IP strategy also covers NDAs, employee contracts and licensing.");
A("Law of Copyright: Rights","Copyright Act, 1957.",["💵|Economic rights|Reproduce, distribute, adapt, communicate.|0","🧑‍🎨|Moral rights|Paternity and integrity (Sec 57).|1","📚|Works covered|Literary, artistic, musical, cinematographic, software.|2","⏳|Term|Life + 60 years.|3"],"Author can stop a distortion of her work even after selling rights.","Copyright protects expression, not ideas; no registration is needed but registration is evidence.");
A("Copyright Infringement, Fair Dealing & Remedies","Permitted use and punishments.",["🚫|Infringement|Unauthorised copying or sale.|2","📖|Fair dealing|Research, criticism, review, news, education.|1","⚖️|Civil|Injunction, damages.|0","👮|Criminal|Imprisonment + fine (Sec 63).|3"],"Quoting a paragraph in a review is fine; photocopying the book for sale is not.","Courts weigh purpose, amount used and market effect when deciding fair dealing.");
A("Patent Searching Process","Prior-art search before filing.",["🔑|Keywords|List technical terms and IPC classes.|0","🗃️|Databases|InPASS, Espacenet, Google Patents.|1","📊|Analyse|Compare claims for novelty.|2","📄|Report|Decide to file, modify or drop.|3"],"Like checking the map before building a shop.","A thorough search saves filing fees and strengthens claims.");
A("PCT & International Patent Filing","Patent Cooperation Treaty route.",["🇮🇳|Home filing|Priority date set.|0","12️⃣|12 months|Convention or PCT deadline.|1","🌐|PCT application|One filing, 150+ states.|2","🗺️|National phase|At 30/31 months, choose countries.|3"],"One application keeps the option open in many countries.","PCT does not grant a global patent; each national office still examines.");
A("Trademark Registration (Trade Marks Act, 1999)","Protecting brand identity.",["🔎|Search|Check conflicting marks.|0","📝|Apply|Class under Nice classification.|1","🧐|Examination & publication|Opposition period 4 months.|2","®️|Registration|Valid 10 years, renewable.|3"],"Brand ‘Amul’ with its logo.","Marks must be distinctive; ™ can be used before and ® only after registration.");
A("Design Registration Process","Designs Act, 2000.",["🎨|Create design|Shape, pattern, ornament.|0","🔍|Novelty search|Check prior designs.|1","📝|File with representation|Drawings with class.|2","✅|Registration|10 yrs + 5 yrs.|3"],"A new bottle contour for a drink brand.","Disclosure before filing destroys novelty, so file before public launch.");
A("Trade Secrets & Geographical Indications","Other IP forms.",["🤫|Trade secret|Formula kept confidential.|0","📃|NDA|Contract to protect it.|1","🗺️|GI|Product linked to place (Darjeeling tea).|2","⏳|Term|Secret: forever; GI: 10 yrs renewable.|3"],"KFC recipe vs Basmati rice GI.","Trade secrets have no registration; GI is governed by the GI Act, 1999.");
A("Digital Content Protection: DRM & Watermarking","Technical locks and marks.",["🔐|DRM|Encrypts content, controls use.|0","💧|Watermark|Hidden mark traces leaks.|1","🧾|Rights info|Metadata on ownership (Sec 65B).|2","📩|Takedown|Platforms remove pirated content.|3"],"Streaming apps block screen copying and pen-drive saving.","Technology plus law (65A, 65B, IT Act Sec 79) together discourage piracy.");

const mp=(b,e,m)=>{let r=1;b%=m;while(e>0){if(e&1)r=r*b%m;b=b*b%m;e>>=1}return r};
const H=s=>{let o="";for(let k=0;k<4;k++){let h=2166136261^(k*7919);for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}o+=(h>>>0).toString(16).padStart(8,"0")}return o};
const W={
4:["Try RSA live (p=3, q=11, e=3, d=7): message M = <b id=rv>4</b><input type=range id=r min=1 max=32 value=4><div id=ro></div>",()=>{const f=()=>{const M=+r.value,C=mp(M,3,33);rv.textContent=M;ro.innerHTML=`Encrypt: C = ${M}³ mod 33 = <code>${C}</code> → Decrypt: ${C}⁷ mod 33 = <code>${mp(C,7,33)}</code> ✅`};r.oninput=f;f()}],
5:["Diffie-Hellman live (p=23, g=5). Alice a=<b id=av></b> <input type=range id=a min=1 max=20 value=6> Bob b=<b id=bv></b> <input type=range id=b min=1 max=20 value=15> <label><input type=checkbox id=mt> 😈 Mallory in the middle (m=9)</label><div id=do></div>",()=>{const f=()=>{const A=mp(5,+a.value,23),B=mp(5,+b.value,23),M=mp(5,9,23);av.textContent=a.value;bv.textContent=b.value;do_=mt.checked?`Alice gets key <code>${mp(M,+a.value,23)}</code> but Bob gets <code>${mp(M,+b.value,23)}</code> – Mallory knows both ❌`:`A=${A}, B=${B}. Alice key = <code>${mp(B,+a.value,23)}</code>, Bob key = <code>${mp(A,+b.value,23)}</code> ✅ identical`;document.getElementById("do").innerHTML=do_};a.oninput=b.oninput=mt.onchange=f;f()}],
6:["Avalanche effect – type anything: <input type=text id=hi value='Pay Rahul 500'><div id=h1 class=mono></div><div id=h2 class=mono></div><small>2nd hash = same text with one letter changed.</small>",()=>{const f=()=>{const s=hi.value,t=s.slice(0,-1)+String.fromCharCode((s.charCodeAt(s.length-1)||64)+1),x=H(s),y=H(t);h1.innerHTML=x;h2.innerHTML=[...y].map((c,i)=>c!=x[i]?`<span class=df>${c}</span>`:c).join("")};hi.oninput=f;f()}],
12:["Password strength lab: <input type=text id=pw placeholder='type a password'><div class=bar><div id=pb2 style='width:4%'></div></div><div id=po></div>",()=>{pw.oninput=()=>{const s=pw.value,R=(/[a-z]/.test(s)?26:0)+(/[A-Z]/.test(s)?26:0)+(/\d/.test(s)?10:0)+(/\W/.test(s)?32:0),g=Math.pow(R||1,s.length)/2e10,u=[[31536e3,"years"],[86400,"days"],[3600,"hours"],[60,"minutes"],[1,"seconds"]];let tx="instantly";for(const[k,n]of u)if(g>=k){tx=(g/k>1e9?"billions of ":(g/k).toFixed(1)+" ")+n;break}pb2.style.width=Math.min(100,Math.log10(g+1)*9+4)+"%";po.innerHTML=s?`Length ${s.length}, alphabet ${R}. At 20 billion guesses/sec: <b>${tx}</b> to brute-force.`:""}}]};

let tab=0,cur=0,step=0,tm=null,done=new Set();
const R=(a,n)=>Array.from({length:10},(_,i)=>a+i);const UM=[[0,1,2,3,4,5,7,9,15,...R(30)],[6,8,11,12,13,17,18,...R(40)],[10,14,16,19,20,21,22,23,...R(50)],[24,25,26,27,28,29,...R(60)]];const uq=u=>UM[u-1];
const $=id=>document.getElementById(id);
function nav(){$("nav").innerHTML=U.map((u,i)=>`<button class="${i==tab?"on":""}" onclick="go(${i})">${u}</button>`).join("")}
function go(t){tab=t;stop();if(t)cur=uq(t)[0];nav();draw()}
function prog(){$("pb").style.width=done.size/70*100+"%";$("pt").textContent=done.size+" / 70 questions understood"+(done.size==70?" 🎉 You’re exam-ready!":"")}
function draw(){prog();const m=$("m");if(!tab){m.innerHTML=`<div class=card><h2>Syllabus map · 4 units · 36 hours · 70 questions</h2><p class=def>Each unit shows only its own questions. Tap a bar to open that unit.</p>${[["Unit 1: Introduction, Cryptography & Key Management",8,"Security components & threats, DES, RSA, PGP, Diffie-Hellman, Needham-Schroeder, PKI"],["Unit 2: Authentication, Hashing, Malicious Code, Mobile & Online Banking",9,"Passwords, Kerberos & Realm, MD5/SHA-1, virus life cycle, GSM/CDMA, cards & UPI"],["Unit 3: Social Engineering, Initiatives, Threats & IT Act",9,"Social engineering, incident handling, firewalls, IT Act, hackers, web app & digital infra security"],["Unit 4: Intellectual Property Rights",10,"Patents, designs, trademarks, copyright, IPR toolkit, ownership, digital content protection"]].map((r,i)=>`<div class=bar onclick="go(${i+1})"><b>${r[0]}</b> <small>${r[2]}</small><div data-w="${r[1]*9}%">${r[1]} hours</div></div>`).join("")}</div>`;setTimeout(()=>document.querySelectorAll(".bar div").forEach(d=>d.style.width=d.dataset.w),60);return}
 const ids=uq(tab),q=Q[cur],nd=q[2];
 m.innerHTML=`<div class=chips>${ids.map(i=>`<span class="chip ${i==cur?"on":""} ${done.has(i)?"ok":""}" onclick="pick(${i})">Q${ids.indexOf(i)+1}</span>`).join("")}</div>
 <div class=card><h2>Q${ids.indexOf(cur)+1}. ${q[0].replace(/^Q\d+\. /,"")}</h2><p class=def>${q[1]}</p><div class=th><b>📖 Theory</b><p>${T[cur]}</p></div><div class=dg id=dg>${nd.map((n,i)=>{const p=n.split("|");return`<div class="nd g${p[3]}" onclick="stop();set(${i})"><b>${p[0]}</b>${p[1]}</div>`}).join("")}<div id=pk></div></div>
 <div id=cap>▶ Press Play, or tap any box.</div><div class=ctl><button id=pl onclick="play()">▶ Play</button><button class=s onclick="stop();set((step+1)%${nd.length})">Step ➜</button><small>Tap boxes to jump · yellow dot = data/ticket moving</small></div>
 <div class=ex>🌍 <b>Real-life example:</b> ${q[3]}</div>${W[cur]?`<div class=w>🧪 ${W[cur][0]}</div>`:""}
 <div class=foot><button class=chip onclick="pick(${ids[ids.indexOf(cur)-1]??cur})">⬅ Prev</button><button class=chip onclick="fin()">${done.has(cur)?"✓ Understood (undo)":"⭐ I understood this"}</button><button class=chip onclick="pick(${ids[ids.indexOf(cur)+1]??cur})">Next ➡</button></div></div>`;
 if(W[cur])W[cur][1]();step=-1;setTimeout(play,500)}
function pick(i){stop();cur=i;draw();scrollTo({top:0,behavior:"smooth"})}
function fin(){done.has(cur)?done.delete(cur):done.add(cur);const ids=uq(tab),n=ids[ids.indexOf(cur)+1];if(done.has(cur)&&n!==undefined)pick(n);else draw()}
function set(i){step=i;const ns=[...document.querySelectorAll(".nd")];ns.forEach((e,k)=>{e.classList.toggle("act",k==i);e.classList.toggle("seen",k<i)});const e=ns[i],p=$("pk");p.style.left=e.offsetLeft+e.offsetWidth/2-9+"px";p.style.top=e.offsetTop-10+"px";const t=Q[cur][2][i].split("|");const c=$("cap");c.style.animation="none";c.offsetHeight;c.style.animation="";c.innerHTML=`<b>${t[0]} ${t[1]}</b> (${i+1}/${ns.length}) — ${t[2]}`}
function play(){stop();if(!$("pl"))return;$("pl").textContent="⏸ Pause";$("pl").onclick=()=>{stop();$("pl").textContent="▶ Play";$("pl").onclick=play};const n=Q[cur][2].length;set(++step>=n?0:step);tm=setInterval(()=>set((step+1)%n),3200)}
function stop(){clearInterval(tm);tm=null}
go(0);
